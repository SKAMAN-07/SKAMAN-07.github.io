<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%" style="background:transparent; overflow:visible;">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="meshGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0b0f19" stop-opacity="0"/>
    </radialGradient>
    
    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="emeraldArbiter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="violetSynth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="amberVerifier" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="crimsonSkeptic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowFilter" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Radiant Mesh Aura -->
  <circle cx="450" cy="300" r="320" fill="url(#meshGlow)"/>

  <!-- Geometric Hexagonal Honeycomb Matrix (The Hive Architecture) -->
  <g stroke="rgba(6, 182, 212, 0.15)" stroke-width="1.2" fill="none" opacity="0.85">
    <!-- Center Hexagons -->
    <polygon points="450,170 536,220 536,320 450,370 364,320 364,220" />
    <polygon points="450,70 536,120 536,220 450,170 364,220 364,120" stroke="rgba(52, 211, 153, 0.25)" />
    <polygon points="536,220 622,270 622,370 536,420 450,370 450,270" stroke="rgba(192, 132, 252, 0.25)" />
    <polygon points="364,220 450,270 450,370 364,420 278,370 278,270" stroke="rgba(56, 189, 248, 0.25)" />
    <polygon points="450,370 536,420 536,520 450,570 364,520 364,420" stroke="rgba(251, 191, 36, 0.2)" />
    <polygon points="622,170 708,220 708,320 622,370 536,320 536,220" stroke="rgba(6, 182, 212, 0.12)" />
    <polygon points="278,170 364,220 364,320 278,370 192,320 192,220" stroke="rgba(244, 63, 94, 0.15)" />
  </g>

  <!-- Concentric Radar Orbit Ring -->
  <circle cx="450" cy="270" r="230" stroke="rgba(34, 211, 238, 0.15)" stroke-width="1" stroke-dasharray="8 6" fill="none"/>
  <circle cx="450" cy="270" r="160" stroke="rgba(52, 211, 153, 0.2)" stroke-width="1.2" stroke-dasharray="4 4" fill="none"/>
  <circle cx="450" cy="270" r="80" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1" fill="none"/>

  <!-- Synaptic Mesh Pathways / Neural Connections -->
  <g stroke-linecap="round">
    <!-- Arbiter Core Synapses -->
    <line x1="450" y1="130" x2="250" y2="230" stroke="url(#cyberCyan)" stroke-width="2.5" opacity="0.8" filter="url(#softGlow)"/>
    <line x1="450" y1="130" x2="650" y2="230" stroke="url(#violetSynth)" stroke-width="2.5" opacity="0.8" filter="url(#softGlow)"/>
    <line x1="450" y1="130" x2="330" y2="400" stroke="url(#crimsonSkeptic)" stroke-width="2" opacity="0.7"/>
    <line x1="450" y1="130" x2="570" y2="400" stroke="url(#amberVerifier)" stroke-width="2" opacity="0.7"/>

    <!-- Council Cross Synapses -->
    <line x1="250" y1="230" x2="650" y2="230" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" stroke-dasharray="6 4"/>
    <line x1="250" y1="230" x2="330" y2="400" stroke="url(#cyberCyan)" stroke-width="2.2" opacity="0.75"/>
    <line x1="650" y1="230" x2="570" y2="400" stroke="url(#violetSynth)" stroke-width="2.2" opacity="0.75"/>
    <line x1="330" y1="400" x2="570" y2="400" stroke="rgba(255, 255, 255, 0.3)" stroke-width="2"/>
    <line x1="250" y1="230" x2="570" y2="400" stroke="rgba(6, 182, 212, 0.35)" stroke-width="1.2"/>
    <line x1="650" y1="230" x2="330" y2="400" stroke="rgba(192, 132, 252, 0.35)" stroke-width="1.2"/>
  </g>

  <!-- Peripheral Neural Satellite Nodes -->
  <g fill="#06b6d4" opacity="0.7">
    <circle cx="160" cy="200" r="4"/>
    <circle cx="210" cy="110" r="3.5"/>
    <circle cx="740" cy="200" r="4"/>
    <circle cx="690" cy="110" r="3.5"/>
    <circle cx="220" cy="460" r="4"/>
    <circle cx="680" cy="460" r="4"/>
    <circle cx="450" cy="490" r="5" fill="#34d399"/>
  </g>
  <g stroke="rgba(255,255,255,0.12)" stroke-width="0.8">
    <line x1="160" y1="200" x2="250" y2="230"/>
    <line x1="210" y1="110" x2="450" y2="130"/>
    <line x1="740" y1="200" x2="650" y2="230"/>
    <line x1="690" y1="110" x2="450" y2="130"/>
    <line x1="220" y1="460" x2="330" y2="400"/>
    <line x1="680" y1="460" x2="570" y2="400"/>
    <line x1="450" y1="490" x2="330" y2="400"/>
    <line x1="450" y1="490" x2="570" y2="400"/>
  </g>

  <!-- 5 Focal Council & Arbiter Neural Centers -->
  <!-- 1. The Executive Arbiter (Top Center Apex) -->
  <g transform="translate(450, 130)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6 3" opacity="0.6"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#34d399" stroke-width="2" opacity="0.9" filter="url(#glowFilter)"/>
    <circle cx="0" cy="0" r="18" fill="url(#emeraldArbiter)"/>
    <circle cx="0" cy="0" r="8" fill="#ffffff"/>
    <text x="0" y="-40" text-anchor="middle" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="2">THE ARBITER</text>
  </g>

  <!-- 2. The Architect (Left) -->
  <g transform="translate(250, 230)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#22d3ee" stroke-width="1.8" opacity="0.9" filter="url(#glowFilter)"/>
    <circle cx="0" cy="0" r="16" fill="url(#cyberCyan)"/>
    <circle cx="0" cy="0" r="7" fill="#ffffff"/>
    <text x="-32" y="5" text-anchor="end" fill="#22d3ee" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">ARCHITECT</text>
  </g>

  <!-- 3. The Synthesizer (Right) -->
  <g transform="translate(650, 230)">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#c084fc" stroke-width="1.8" opacity="0.9" filter="url(#glowFilter)"/>
    <circle cx="0" cy="0" r="16" fill="url(#violetSynth)"/>
    <circle cx="0" cy="0" r="7" fill="#ffffff"/>
    <text x="32" y="5" text-anchor="start" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">SYNTHESIZER</text>
  </g>

  <!-- 4. The Skeptic (Bottom Left) -->
  <g transform="translate(330, 400)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#f87171" stroke-width="1.8" opacity="0.9" filter="url(#glowFilter)"/>
    <circle cx="0" cy="0" r="15" fill="url(#crimsonSkeptic)"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
    <text x="0" y="34" text-anchor="middle" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">SKEPTIC</text>
  </g>

  <!-- 5. The Verifier (Bottom Right) -->
  <g transform="translate(570, 400)">
    <circle cx="0" cy="0" r="20" fill="none" stroke="#fbbf24" stroke-width="1.8" opacity="0.9" filter="url(#glowFilter)"/>
    <circle cx="0" cy="0" r="15" fill="url(#amberVerifier)"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
    <text x="0" y="34" text-anchor="middle" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">VERIFIER</text>
  </g>

  <!-- High-Velocity Action Potential Synaptic Sparks -->
  <g filter="url(#glowFilter)">
    <circle cx="350" cy="180" r="4.5" fill="#ffffff"/>
    <circle cx="550" cy="180" r="4.5" fill="#ffffff"/>
    <circle cx="450" cy="400" r="4.5" fill="#ffffff"/>
    <circle cx="290" cy="315" r="4" fill="#22d3ee"/>
    <circle cx="610" cy="315" r="4" fill="#c084fc"/>
  </g>

  <!-- Center Mesh Core Emblem -->
  <g transform="translate(450, 270)" filter="url(#glowFilter)">
    <polygon points="0,-24 21,-12 21,12 0,24 -21,12 -21,-12" fill="none" stroke="#22d3ee" stroke-width="2"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
  </g>

  <!-- Typographic Branding Lockup: HIVE AI'S MESH -->
  <g transform="translate(450, 560)">
    <!-- Main Title -->
    <text x="0" y="0" text-anchor="middle" fill="url(#textGrad)" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="4" filter="url(#softGlow)">
      HIVE AIS MESH
    </text>
    <!-- Subtitle -->
    <text x="0" y="24" text-anchor="middle" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="500" letter-spacing="3">
      MULTI-MODEL DELIBERATION • ZERO-BURDEN SYNAPSE ARCHITECTURE
    </text>
  </g>
</svg>
